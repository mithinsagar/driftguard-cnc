name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install numpy scipy h5py pandas scikit-learn pytest ruff==0.17.6 tabulate onnxruntime fastapi httpx pydantic
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check src scripts tests
      - run: PYTHONPATH=src pytest -q tests/test_dsp_synthetic.py tests/test_conformal_math.py tests/test_gate_faults.py tests/test_splits_no_leakage.py tests/test_stream_policies.py tests/test_adaptive_calibrator.py tests/test_api.py tests/test_w1acas_and_fallback.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t driftguard .
      - run: docker run -d -p 8000:8000 --name dg driftguard
      - run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/v1/health && break; sleep 2; done
          curl -sf localhost:8000/v1/health
          curl -sf localhost:8000/v1/demo/streams | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['scenes']) == 3"
          python3 -c "import json,random; json.dump({'samples': [[random.gauss(0,1) for _ in range(3)] for _ in range(4000)]}, open('body.json','w'))"
          curl -sf -X POST localhost:8000/v1/score -H 'Content-Type: application/json' -d @body.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['decision'] in ('NORMAL','ANOMALY'), d"
