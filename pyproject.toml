[project]
name = "driftguard"
version = "0.1.0"
description = "False-alarm-controlled vibration anomaly detection on the Bosch CNC Machining dataset"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["driftguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_*.py" = ["E501"]   # report and table templates hold long text lines
"scripts/update_*.py" = ["E501"]
